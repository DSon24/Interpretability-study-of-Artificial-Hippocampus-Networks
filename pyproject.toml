[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahn"
version = "0.1.0"
description = "Artificial Hippocampus Network"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Yunhao Fang", email = "seerkfang@gmail.com" },
    { name = "Weihao Yu", email = "weihaoyu6@gmail.com" }
]
# Needed to `import ahn` at all: qwen2_ahn/qwen3_ahn import wandb and fla at
# module scope, and transformers' from_pretrained needs accelerate for
# init_empty_weights. torch is pinned because an unpinned resolve picks up
# CUDA 13 wheels, which fail on CUDA 12.x drivers.
dependencies = [
  "torch==2.5.1",
  "accelerate==1.6.0",
  "wandb",
  # Forked FLA; upstream FLA on PyPI is not a substitute.
  "flash-linear-attention @ git+https://github.com/Seerkfang/flash-linear-attention.git@main",
]

[project.optional-dependencies]
# Everything needed to train
train = [
  "tensorflow==2.18.0",
  "tf-keras==2.18.0",
  "deepspeed==0.16.2",
  "numpy==1.26.4",
  "datasets==3.6.0",
  "transformers==4.51.0",
  "liger-kernel"
]

# FlashAttention-2. Required for correctness, not speed: the sliding-window
# attention this project depends on is not implemented for sdpa, so a non-FA2
# load silently ignores CFG["sliding_window"] and AHN never activates.
# Kept out of the core deps because the PyPI package is an sdist that compiles
# against nvcc (~30 min, and impossible on a box without the CUDA toolkit).
# Install the prebuilt wheel matching your torch/python/ABI instead, e.g.:
#   pip install "https://github.com/Dao-AILab/flash-attention/releases/download/\
#     v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.5cxx11abiFALSE-cp312-cp312-linux_x86_64.whl"
gpu = [
  "flash-attn==2.7.4.post1",
]

# Everything needed to eval
eval = [
  "fuzzywuzzy",
  "jieba",
  "rouge"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ahn*"]
namespaces = true
